name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Build & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked runtime modules
        run: git ls-files --error-unmatch backend/src/modules/uploads/uploads.routes.js

      - name: Run Backend Syntax Checks
        run: |
          node --check backend/server.js
          node --check backend/src/config.js
          node --check backend/src/core.js
          node --check backend/src/domain.js
          node --check backend/src/middleware.js

      - name: Run Automated Test Suite
        run: npm test

      - name: Run Adversarial Security Suite
        run: npm run test:security

      - name: Run TypeScript Checks
        run: npm run typecheck

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Build Frontend Application
        run: npm run build

      - name: Build Production Container
        run: docker build --tag nalanda:${{ github.sha }} .


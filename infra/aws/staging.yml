AWSTemplateFormatVersion: "2010-09-09"
Description: Nalanda production-shaped single-writer staging environment

Parameters:
  EnvironmentName:
    Type: String
    Default: nalanda-staging
    AllowedPattern: "[a-z0-9-]+"
  ContainerImage:
    Type: String
    AllowedPattern: '^[^\s]+@sha256:[0-9a-f]{64}$'
    Description: Immutable ECR image URI pinned to a sha256 manifest digest
  SourceRevision:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'
    Description: Full Git commit revision used to build the container image
  DatabaseName:
    Type: String
    Default: nalanda
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]+"
  DatabaseUsername:
    Type: String
    Default: nalanda_admin
  RazorpayKeyIdSecretArn:
    Type: String
  RazorpayKeySecretArn:
    Type: String
  RazorpayWebhookSecretArn:
    Type: String
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address for staging alarm notifications
  WafRateLimit:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Maximum requests per forwarded client IP in a five-minute window
  CustomDomainName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
    Description: Optional validated DNS name for the CloudFront distribution
  HostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^Z[A-Z0-9]+$'
    Description: Route 53 public hosted zone ID for the optional custom domain
  CloudFrontCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[^:]+:acm:us-east-1:[0-9]{12}:certificate/[A-Za-z0-9-]+$'
    Description: Optional validated ACM certificate ARN from us-east-1
  OriginDomainName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
    Description: Optional public DNS name used only by CloudFront to reach the ALB over TLS
  OriginCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[^:]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/[A-Za-z0-9-]+$'
    Description: Optional validated ACM certificate ARN from the deployment region for the origin hostname
  CloudFrontOriginPrefixList:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /aws/service/global-infrastructure/services/cloudfront/origin-facing/prefix-list-id

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref CloudFrontCertificateArn, ""]]
  HasOriginTls: !And
    - !Not [!Equals [!Ref OriginDomainName, ""]]
    - !Not [!Equals [!Ref OriginCertificateArn, ""]]

Rules:
  CompleteCustomDomainConfiguration:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref CustomDomainName, ""]
            - !Equals [!Ref HostedZoneId, ""]
            - !Equals [!Ref CloudFrontCertificateArn, ""]
          - !And
            - !Not [!Equals [!Ref CustomDomainName, ""]]
            - !Not [!Equals [!Ref HostedZoneId, ""]]
            - !Not [!Equals [!Ref CloudFrontCertificateArn, ""]]
        AssertDescription: CustomDomainName, HostedZoneId and CloudFrontCertificateArn must be supplied together
  CompleteOriginTlsConfiguration:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref OriginDomainName, ""]
            - !Equals [!Ref OriginCertificateArn, ""]
          - !And
            - !Not [!Equals [!Ref OriginDomainName, ""]]
            - !Not [!Equals [!Ref OriginCertificateArn, ""]]
            - !Not [!Equals [!Ref HostedZoneId, ""]]
            - !Not [!Equals [!Ref OriginDomainName, !Ref CustomDomainName]]
        AssertDescription: OriginDomainName and OriginCertificateArn must be supplied together with a hosted zone, and the origin name must differ from the application name

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.40.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.40.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-b

  ApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.40.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-application-a

  ApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.40.3.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-application-b

  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.40.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data-a

  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.40.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEipA:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatEipB:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat-a

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat-b

  ApplicationRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  ApplicationRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  ApplicationDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref ApplicationRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  ApplicationDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref ApplicationRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  ApplicationRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ApplicationSubnetA
      RouteTableId: !Ref ApplicationRouteTableA

  ApplicationRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ApplicationSubnetB
      RouteTableId: !Ref ApplicationRouteTableB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin traffic only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - !If
          - HasOriginTls
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref CloudFrontOriginPrefixList
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            SourcePrefixListId: !Ref CloudFrontOriginPrefixList
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nalanda Fargate task
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from Nalanda tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis TLS from Nalanda tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${EnvironmentName} isolated data subnets
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 20:00-20:30
      PreferredMaintenanceWindow: sun:21:00-sun:22:00
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub ${EnvironmentName} isolated cache subnets
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetB]

  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: !Sub ${EnvironmentName} request controls
      Engine: redis
      CacheNodeType: cache.t4g.micro
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds: [!GetAtt CacheSecurityGroup.GroupId]
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      SnapshotRetentionLimit: 1

  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAlbLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AccessLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub ${AccessLogBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub ${MediaBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: NoReadOfProtectedObjectsUnlessClean
            Effect: Deny
            NotPrincipal:
              AWS:
                - !GetAtt MalwareProtectionRole.Arn
                - !Sub arn:${AWS::Partition}:sts::${AWS::AccountId}:assumed-role/${MalwareProtectionRole}/GuardDutyMalwareProtection
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub ${MediaBucket.Arn}/course_media/*
              - !Sub ${MediaBucket.Arn}/chapter_pdf/*
              - !Sub ${MediaBucket.Arn}/proctoring/*
            Condition:
              StringNotEquals:
                s3:ExistingObjectTag/GuardDutyMalwareScanStatus: NO_THREATS_FOUND
          - Sid: OnlyGuardDutyCanSetMalwareScanStatus
            Effect: Deny
            NotPrincipal:
              AWS:
                - !GetAtt MalwareProtectionRole.Arn
                - !Sub arn:${AWS::Partition}:sts::${AWS::AccountId}:assumed-role/${MalwareProtectionRole}/GuardDutyMalwareProtection
            Action:
              - s3:PutObjectTagging
              - s3:PutObjectVersionTagging
            Resource:
              - !Sub ${MediaBucket.Arn}/course_media/*
              - !Sub ${MediaBucket.Arn}/chapter_pdf/*
              - !Sub ${MediaBucket.Arn}/proctoring/*
            Condition:
              ForAnyValue:StringEquals:
                s3:RequestObjectTagKeys: GuardDutyMalwareScanStatus

  MalwareProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScanPrivateMedia
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowManagedRuleToSendS3EventsToGuardDuty
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
                Condition:
                  StringLike:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com
              - Sid: AllowGuardDutyToMonitorEventBridgeManagedRule
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
              - Sid: AllowPostScanTag
                Effect: Allow
                Action:
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  - s3:PutObjectVersionTagging
                  - s3:GetObjectVersionTagging
                Resource:
                  - !Sub ${MediaBucket.Arn}/course_media/*
                  - !Sub ${MediaBucket.Arn}/chapter_pdf/*
                  - !Sub ${MediaBucket.Arn}/proctoring/*
              - Sid: AllowEnableS3EventBridgeEvents
                Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt MediaBucket.Arn
              - Sid: AllowPutValidationObject
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${MediaBucket.Arn}/malware-protection-resource-validation-object
              - Sid: AllowCheckBucketOwnership
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
              - Sid: AllowMalwareScan
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub ${MediaBucket.Arn}/course_media/*
                  - !Sub ${MediaBucket.Arn}/chapter_pdf/*
                  - !Sub ${MediaBucket.Arn}/proctoring/*

  MalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    DependsOn: MediaBucketPolicy
    Properties:
      Role: !GetAtt MalwareProtectionRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref MediaBucket
          ObjectPrefixes:
            - course_media/
            - chapter_pdf/
            - proctoring/
      Actions:
        Tagging:
          Status: ENABLED

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub ${EnvironmentName} JWT signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  CertificateSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub ${EnvironmentName} certificate signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  PrivacyPseudonymSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub ${EnvironmentName} privacy pseudonymization secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  BootstrapAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub ${EnvironmentName} one-time bootstrap administrator password
      GenerateSecretString:
        PasswordLength: 32
        RequireEachIncludedType: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}
      RetentionInDays: 30

  ReadinessFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.message = "READINESS_CHECK_FAILED" }'
      MetricTransformations:
        - MetricNamespace: Nalanda/Runtime
          MetricName: ReadinessFailures
          MetricValue: "1"
          DefaultValue: 0

  ApplicationErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: Nalanda/Runtime
          MetricName: ApplicationErrors
          MetricValue: "1"
          DefaultValue: 0

  AlertKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub ${EnvironmentName} alarm notification encryption key
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchAlarmPublishing
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${EnvironmentName}-*
          - Sid: AllowEventBridgeMalwareAlerts
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EnvironmentName}-malware-*

  AlertKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${EnvironmentName}-alerts
      TargetKeyId: !Ref AlertKey

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-alerts
      KmsMasterKeyId: !GetAtt AlertKey.Arn

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeMalwareAlerts
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${EnvironmentName}-malware-*

  MalwareScanResultAlert:
    Type: AWS::Events::Rule
    DependsOn: AlertTopicPolicy
    Properties:
      Name: !Sub ${EnvironmentName}-malware-scan-result
      Description: Alert when a protected object is unsafe or cannot be scanned
      State: ENABLED
      EventPattern:
        source: [aws.guardduty]
        detail-type: [GuardDuty Malware Protection Object Scan Result]
        resources: [!GetAtt MalwareProtectionPlan.Arn]
        detail:
          scanResultDetails:
            scanResultStatus:
              - THREATS_FOUND
              - UNSUPPORTED
              - ACCESS_DENIED
              - FAILED
      Targets:
        - Arn: !Ref AlertTopic
          Id: MalwareScanResultAlertTopic

  MalwareProtectionHealthAlert:
    Type: AWS::Events::Rule
    DependsOn: AlertTopicPolicy
    Properties:
      Name: !Sub ${EnvironmentName}-malware-protection-health
      Description: Alert when malware protection or post-scan tagging is unhealthy
      State: ENABLED
      EventPattern:
        source: [aws.guardduty]
        resources: [!GetAtt MalwareProtectionPlan.Arn]
        detail-type:
          - GuardDuty Malware Protection Resource Status Warning
          - GuardDuty Malware Protection Resource Status Error
          - GuardDuty Malware Protection Post Scan Action Failed
      Targets:
        - Arn: !Ref AlertTopic
          Id: MalwareProtectionHealthAlertTopic

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSecret
                  - !Ref CertificateSecret
                  - !Ref PrivacyPseudonymSecret
                  - !Ref BootstrapAdminSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RazorpayKeyIdSecretArn
                  - !Ref RazorpayKeySecretArn
                  - !Ref RazorpayWebhookSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrivateMediaObjects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectTagging, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${MediaBucket.Arn}/*

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref EnvironmentName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref EnvironmentName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: nalanda
          Image: !Ref ContainerImage
          DockerLabels:
            org.opencontainers.image.revision: !Ref SourceRevision
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "8080" }
            - { Name: TRUST_PROXY, Value: "2" }
            - Name: ALLOWED_ORIGINS
              Value: !If
                - HasCustomDomain
                - !Sub https://${CustomDomainName}
                - !Sub https://${Distribution.DomainName}
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: !Ref DatabaseName }
            - { Name: PGSSL, Value: require }
            - { Name: PGPOOL_MAX, Value: "8" }
            - { Name: USE_PG_PAYMENTS, Value: "0" }
            - { Name: USE_PG_SKILLS, Value: "0" }
            - { Name: USE_PG_IDENTITY, Value: "0" }
            - { Name: USE_PG_ATTEMPTS, Value: "0" }
            - { Name: USE_PG_CERTIFICATES, Value: "0" }
            - { Name: USE_PG_CANDIDATE_ASSESSMENTS, Value: "0" }
            - { Name: USE_PG_COURSES, Value: "0" }
            - { Name: COURSE_AUTHORITY_COVERAGE_ACK, Value: "" }
            - { Name: USE_PG_WORKPLACE, Value: "0" }
            - { Name: USE_PG_PRIVACY, Value: "0" }
            - { Name: USE_PG_SETTINGS, Value: "0" }
            - { Name: USE_PG_AUDIT, Value: "0" }
            - { Name: ENABLE_PRIVACY_ERASURE_WORKER, Value: "0" }
            - { Name: ENABLE_REPORT_EXPORT_WORKER, Value: "0" }
            - { Name: PRIVACY_COVERAGE_ACK, Value: "" }
            - { Name: APP_TIME_ZONE, Value: Asia/Kolkata }
            - { Name: REDIS_URL, Value: !Sub "rediss://${Cache.PrimaryEndPoint.Address}:${Cache.PrimaryEndPoint.Port}" }
            - { Name: S3_BUCKET, Value: !Ref MediaBucket }
            - { Name: S3_REGION, Value: !Ref AWS::Region }
            - { Name: CERTIFICATE_ISSUANCE_APPROVAL_ROLE, Value: Admin }
            - { Name: PROCTORING_RETENTION_DAYS, Value: "90" }
          Secrets:
            - { Name: JWT_SECRET, ValueFrom: !Ref JwtSecret }
            - { Name: CERTIFICATE_SIGNING_SECRET, ValueFrom: !Ref CertificateSecret }
            - { Name: PRIVACY_PSEUDONYM_SECRET, ValueFrom: !Ref PrivacyPseudonymSecret }
            - { Name: SEED_SUPERADMIN_PASSWORD, ValueFrom: !Ref BootstrapAdminSecret }
            - { Name: PGUSER, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:username::" }
            - { Name: PGPASSWORD, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::" }
            - { Name: RAZORPAY_KEY_ID, ValueFrom: !Ref RazorpayKeyIdSecretArn }
            - { Name: RAZORPAY_KEY_SECRET, ValueFrom: !Ref RazorpayKeySecretArn }
            - { Name: RAZORPAY_WEBHOOK_SECRET, ValueFrom: !Ref RazorpayWebhookSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AccessLogBucketPolicy
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref AccessLogBucket
        - Key: access_logs.s3.prefix
          Value: alb
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"

  RegionalWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${EnvironmentName}-regional
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${EnvironmentName}-regional
        SampledRequestsEnabled: true
      Rules:
        - Name: ForwardedIpRateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig:
                HeaderName: X-Forwarded-For
                FallbackBehavior: MATCH
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ForwardedIpRateLimit
            SampledRequestsEnabled: true
        - Name: AwsManagedCommonThreatsCount
          Priority: 10
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AwsManagedCommonThreatsCount
            SampledRequestsEnabled: true
        - Name: AwsManagedKnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AwsManagedKnownBadInputs
            SampledRequestsEnabled: true

  RegionalWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt RegionalWebAcl.Arn

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/ready
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If [HasOriginTls, 443, 80]
      Protocol: !If [HasOriginTls, HTTPS, HTTP]
      SslPolicy: !If [HasOriginTls, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      Certificates:
        - !If
          - HasOriginTls
          - CertificateArn: !Ref OriginCertificateArn
          - !Ref AWS::NoValue
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApplicationSecurityGroup]
          Subnets: [!Ref ApplicationSubnetA, !Ref ApplicationSubnetB]
      LoadBalancers:
        - ContainerName: nalanda
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-unhealthy-target
      AlarmDescription: Nalanda has an unhealthy application target
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  TargetFiveHundredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-target-5xx
      AlarmDescription: Nalanda target returned at least five 5xx responses in five minutes
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ServiceCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-service-cpu
      AlarmDescription: Nalanda service CPU is above 80 percent
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ServiceMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-service-memory
      AlarmDescription: Nalanda service memory is above 80 percent
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-database-cpu
      AlarmDescription: Nalanda PostgreSQL CPU is above 80 percent
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-database-free-storage
      AlarmDescription: Nalanda PostgreSQL free storage is below 2 GiB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ReadinessFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-readiness-failure
      AlarmDescription: Nalanda emitted a fail-closed readiness failure
      Namespace: Nalanda/Runtime
      MetricName: ReadinessFailures
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ApplicationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-application-errors
      AlarmDescription: Nalanda emitted five application errors in five minutes
      Namespace: Nalanda/Runtime
      MetricName: ApplicationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  WafBlockedRequestAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-waf-blocked-requests
      AlarmDescription: AWS WAF blocked at least 100 requests in five minutes
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub ${EnvironmentName}-regional
        - Name: Region
          Value: !Ref AWS::Region
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${EnvironmentName}-disabled-cache
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${EnvironmentName}-all-viewer-except-host
        CookiesConfig: { CookieBehavior: all }
        QueryStringsConfig: { QueryStringBehavior: all }
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers: [Host]

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${EnvironmentName}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: alb
            DomainName: !If
              - HasOriginTls
              - !Ref OriginDomainARecord
              - !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: !If [HasOriginTls, https-only, http-only]
              HTTPPort: !If [HasOriginTls, !Ref AWS::NoValue, 80]
              HTTPSPort: !If [HasOriginTls, 443, !Ref AWS::NoValue]
              OriginSSLProtocols: !If
                - HasOriginTls
                - [TLSv1.2]
                - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy

  CustomDomainARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  OriginDomainARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasOriginTls
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  CustomDomainAaaaRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  ApplicationUrl:
    Value: !If
      - HasCustomDomain
      - !Sub https://${CustomDomainName}
      - !Sub https://${Distribution.DomainName}
  CloudFrontDistributionId:
    Value: !Ref Distribution
  CloudFrontOriginName:
    Value: !If
      - HasOriginTls
      - !Ref OriginDomainName
      - !GetAtt LoadBalancer.DNSName
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup
  ApplicationListenerArn:
    Value: !Ref HttpListener
  CloudFrontOriginPrefixListId:
    Value: !Ref CloudFrontOriginPrefixList
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  MediaBucketName:
    Value: !Ref MediaBucket
  AccessLogBucketName:
    Value: !Ref AccessLogBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
  RegionalWebAclArn:
    Value: !GetAtt RegionalWebAcl.Arn
  MalwareProtectionPlanArn:
    Value: !GetAtt MalwareProtectionPlan.Arn
  BootstrapAdminSecretArn:
    Value: !Ref BootstrapAdminSecret
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DatabaseIdentifier:
    Value: !Ref Database
  DatabaseSubnetGroupName:
    Value: !Ref DatabaseSubnetGroup
  DatabaseSecurityGroupId:
    Value: !GetAtt DatabaseSecurityGroup.GroupId
  DatabaseName:
    Value: !Ref DatabaseName
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  SourceRevision:
    Value: !Ref SourceRevision
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  ApplicationSubnetIds:
    Value: !Join [",", [!Ref ApplicationSubnetA, !Ref ApplicationSubnetB]]
  ApplicationRouteTableIds:
    Value: !Join [",", [!Ref ApplicationRouteTableA, !Ref ApplicationRouteTableB]]
  NatGatewayIds:
    Value: !Join [",", [!Ref NatGatewayA, !Ref NatGatewayB]]
  ApplicationSecurityGroupId:
    Value: !Ref ApplicationSecurityGroup

openapi: 3.0.3
info:
  title: Nalanda Training and Development API
  version: 1.0.0
  description: API contract for role-based learning, course management, strict assessments, proctoring, analytics, and reports.
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Login ID. Use "Super Admin" for the Super Admin account; all other users use their email address.
        password: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 10 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [Super Admin, Admin, Manager, Employee] }
        department: { type: string }
        managerId: { type: string, nullable: true }
        status: { type: string, enum: [Active, Inactive] }
        sessionVersion: { type: integer, description: Incremented to revoke stale JWTs after deactivation or deletion. }
    Course:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        skill: { type: string }
        tags:
          type: array
          items: { type: string }
        approval: { type: string, enum: [Pending, Approved, Rejected] }
        status: { type: string, enum: [Active, Inactive] }
        version: { type: integer }
    Assessment:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        courseId: { type: string }
        chapterId: { type: string, nullable: true }
        type: { type: string, enum: [MCQ, Descriptive, Timed Quiz, Mixed] }
        strictMode: { type: boolean }
        approval: { type: string, enum: [Pending, Approved, Rejected] }
        timeSpentSeconds: { type: integer, description: Elapsed time captured on the submitted attempt. }
    Chapter:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        sequence: { type: integer }
        title: { type: string }
        contentType: { type: string, enum: [Rich Text, PDF, Video Link] }
        durationMinutes: { type: integer }
        minimumTimeMinutes:
          type: integer
          description: Minimum required learner time before the chapter gate is met.
    LearningTimeRow:
      type: object
      properties:
        userId: { type: string }
        courseId: { type: string }
        chapterId: { type: string, nullable: true }
        minimumTimeSeconds: { type: integer }
        minimumTimeMet: { type: boolean }
        chapterTimeSeconds: { type: integer }
        assessmentTimeSeconds: { type: integer }
        courseTimeSeconds: { type: integer }
paths:
  /health:
    get:
      security: []
      summary: Service health
      responses:
        "200": { description: OK }
  /auth/login:
    post:
      security: []
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "429":
          description: Source or source/identifier pair is throttled
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
  /auth/forgot-password:
    post:
      security: []
      summary: Queue account-neutral password recovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        "200": { description: Generic response for existing and unknown accounts }
        "429": { description: Source or source/address pair is throttled }
        "503": { description: Durable reset queue is unavailable }
  /auth/reset-password:
    post:
      security: []
      summary: Consume a short-lived password-reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        "200": { description: Password changed and prior sessions revoked }
        "400": { description: Invalid, expired or already-consumed token }
        "401": { description: Invalid credentials }
        "403": { description: Invalid CSRF token or account lockout }
  /auth/me:
    get:
      summary: Current authenticated user
      responses:
        "200": { description: Current user }
  /users:
    get:
      summary: List users visible to Admin or Manager
      parameters:
        - in: query
          name: department
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200": { description: User list }
    post:
      summary: Create user; Admin only
      responses:
        "201": { description: User created }
  /users/{id}:
    patch:
      summary: Update user role, manager, department, or profile fields
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: User updated; deactivation increments sessionVersion and revokes existing JWTs }
    delete:
      summary: Permanently delete and archive a user; Super Admin only
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deletionComment]
              properties:
                deletionComment: { type: string, minLength: 10 }
      responses:
        "200": { description: User deleted; future API access with that token is rejected }
  /users/{id}/status:
    patch:
      summary: Inactivate or reactivate user without deleting records; deactivation revokes existing JWTs
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Status changed }
  /courses:
    get:
      summary: List courses by role and filters
      responses:
        "200": { description: Course list }
    post:
      summary: Create course with PDF, text, video link, or uploaded video content
      responses:
        "201": { description: Course created }
  /courses/{id}:
    put:
      summary: Update course and create a new version
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Course updated }
  /courses/{id}/duplicate:
    post:
      summary: Duplicate a course as a new pending draft
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201": { description: Course duplicated }
  /courses/{id}/approval:
    patch:
      summary: Admin approval or rejection for course
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Course reviewed }
  /courses/{courseId}/chapters:
    get:
      summary: List chapters for a course, including minimum-time requirements
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Chapter list }
    post:
      summary: Create a chapter with a minimum required time gate
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Chapter' }
      responses:
        "201": { description: Chapter created }
  /courses/{courseId}/chapters/{chapterId}:
    put:
      summary: Update chapter content or minimum required time
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
        - in: path
          name: chapterId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Chapter updated }
  /assignments:
    post:
      summary: Assign course to individuals or teams
      responses:
        "201": { description: Assignment created }
  /assessments:
    get:
      summary: List assessments by role
      responses:
        "200": { description: Assessment list }
    post:
      summary: Create assessment and submit for approval when created by Manager
      responses:
        "201": { description: Assessment created }
  /assessments/{id}/approval:
    patch:
      summary: Admin approval or rejection for assessment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Assessment reviewed }
  /assessments/{id}/attempts/start:
    post:
      summary: Start an assessment attempt with strict mode rules
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201": { description: Attempt started }
  /assessments/attempts/{attemptId}/submit:
    post:
      summary: Submit answers, calculate MCQ score or queue manual review, and persist assessment time
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { type: object }
                selectedQuestionIds:
                  type: array
                  items: { type: string }
                tabSwitchWarnings: { type: integer, minimum: 0 }
                autoSubmittedReason: { type: string, nullable: true }
                timeSpentSeconds: { type: integer, minimum: 0 }
      responses:
        "200": { description: Attempt submitted; course and assessment time totals updated }
  /proctoring/events:
    post:
      summary: Append proctoring events such as tab switch, noise, camera off, or fullscreen exit
      responses:
        "201": { description: Proctoring event logged }
  /analytics/global:
    get:
      summary: Admin global analytics
      responses:
        "200": { description: Analytics returned }
  /analytics/team:
    get:
      summary: Manager team analytics
      responses:
        "200": { description: Analytics returned }
  /analytics/time:
    get:
      summary: Time spent by employee on chapters, assessments, and courses
      responses:
        "200":
          description: Learning time rows returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LearningTimeRow' }
                  summary:
                    type: object
                    properties:
                      chapterTimeSeconds: { type: integer }
                      assessmentTimeSeconds: { type: integer }
                      courseTimeSeconds: { type: integer }
  /analytics/time/events:
    get:
      summary: Recent raw chapter and assessment time events for audit/reporting
      responses:
        "200": { description: Learning time events returned }
  /analytics/me:
    get:
      summary: User learning analytics
      responses:
        "200": { description: Analytics returned }
  /courses/{courseId}/chapters/{chapterId}/time:
    post:
      summary: Add tracked chapter time in seconds for the authenticated learner and return gate totals
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: string }
        - in: path
          name: chapterId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds: { type: integer, minimum: 1 }
      responses:
        "200": { description: Time added; response includes per-chapter, course, assessment, and minimum-time gate totals }
  /reports/export:
    post:
      summary: Queue a private PDF or Excel report artifact with canonical time totals
      responses:
        "202": { description: Report prepared for asynchronous private artifact generation }
  /reports/{reportId}:
    get:
      summary: Read an authorized report artifact status without exposing its object key
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Requester-scoped or administrator-scoped report status }
        "404": { description: Report not found within the caller scope }
  /reports/{reportId}/download:
    get:
      summary: Issue an authorized five-minute attachment grant for a ready report
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Subject-bound short-lived download grant }
        "409": { description: Artifact is not ready }
  /settings:
    get:
      summary: Read proctoring and security settings
      responses:
        "200": { description: Settings returned }
    patch:
      summary: Update proctoring and security settings
      responses:
        "200": { description: Settings updated }
  /audit-logs:
    get:
      summary: Admin audit log feed
      responses:
        "200": { description: Audit logs returned }
